# Cấu hình Alembic (quản lý phiên bản cấu trúc CSDL).
# Địa chỉ CSDL lấy từ tệp .env (DATABASE_URL) – xem migrations/env.py.
# Lệnh thường dùng:
#   alembic upgrade head                         (cập nhật CSDL lên bản mới nhất)
#   alembic revision --autogenerate -m "mo ta"   (tạo bản migration sau khi sửa models.py)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
