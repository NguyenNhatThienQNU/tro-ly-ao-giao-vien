[project]
name = "tro-ly-ao-giao-vien"
version = "0.1.0"
description = "Trợ lý ảo hỗ trợ giáo viên quản lý lớp học, cá nhân hóa bài tập và chấm bài qua ảnh bằng AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "google-genai>=1.40",
    "segno>=1.6",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # dòng dài trong chuỗi tiếng Việt
    "B008",    # FastAPI Depends/Form trong tham số mặc định
    "RUF001",  # ký tự Unicode trong chuỗi (tiếng Việt)
    "RUF002",
    "RUF003",
    "RUF012",
    "SIM108",
]
